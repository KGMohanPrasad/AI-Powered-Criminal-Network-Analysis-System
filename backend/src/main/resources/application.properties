# ====================================================================
# Criminal Investigation & Network Analysis Management System
# Spring Boot Configuration
# ====================================================================

spring.application.name=criminal-network-analysis-backend
server.port=8080

# Primary Data Source (Persistent H2 in MySQL-compatibility mode for out-of-the-box zero-setup execution)
# To run against live MySQL Server 8, run with: -Dspring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=jdbc:h2:file:./data/criminal_network;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Accessible in dev for inspecting tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration
app.jwt.secret=9a7c3b2e5f8a1d4c6b8e0f2a4c6e8b0d2f4a6c8e0b2d4f6a8c0e2b4d6f8a0c2e
app.jwt.expiration-ms=86400000

# File upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Logging
logging.level.com.intelligence.criminalnetwork=INFO
logging.level.org.springframework.security=WARN
